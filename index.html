<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth</title>
</head>
<style>
    html{
        scroll-behavior: smooth;

    }
    a{
        color: cadetblue;
        font-weight: bolder;
    }
    body{
       
        align-content: center;
        
        text-align: center;
       
    }
    section{
        margin-bottom: 3px;
        padding: 100px;
    }
    header{
        font-size: xx-large;
        position:fixed;
        background-color: beige;
        padding: 20px;
       width: 100%;
       
    }
    nav{
        
        align-content: center;
    }
    main{
        font-size: 200px;
        color:white;

    }
   #home{
    
        background-position: center;
        background-repeat: no-repeat;
        margin-top: 80px;
        align-items: center;
        background-size: cover;
        background-image: url("https://media.istockphoto.com/id/517188688/photo/mountain-landscape.jpg?s=1024x1024&w=0&k=20&c=z8_rWaI8x4zApNEEG9DnWlGXyDIXe-OmsAyQ5fGPVV8=") }
    #about{
        background-size: cover;
        background-repeat: no-repeat;
        background-image: url("https://img.freepik.com/free-photo/beautiful-lake-mountains_395237-44.jpg?semt=ais_wordcount_boost&w=740&q=80")}
    #list{
        background-size: cover;
         background-repeat: no-repeat;
        background-image: url("https://thumbs.dreamstime.com/b/beautiful-rain-forest-ang-ka-nature-trail-doi-inthanon-national-park-thailand-36703721.jpg") }
    #contact{
        background-size: cover;
         background-repeat: no-repeat;
        background-image: url("https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8YWZyaWNhbiUyMG5hdHVyZXxlbnwwfHwwfHx8MA%3D%3D");
    }
</style>
<body>
    <header> <nav>
    <a href="#home">Home  |</a>
    <a href="#about">About  |</a>
    <a href="#list">List  |</a>
    <a href="#contact">Contact   </a></nav></header>
   
    <main>
    <section id="home">
    <h3>home</h3>
       </section>
    <section id="about">
    <h3>about</h3>
      </section>
      <section id="list">
    <h3>list</h3>
      </section>
    <section id="contact">
    <h3>contact</h3>
   </section>
   </main>
</body>
</html>
